name: mindvibe_app
description: "MindVibe — Academia Mental"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  intl: 0.20.2
  uuid: ^4.6.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/APP_ICON_CERTO.png
  adaptive_icon_background: "#0B2C2A"
  adaptive_icon_foreground: assets/branding/APP_ICON_CERTO.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F3EEE6"
  color_dark: "#050505"
  image: assets/branding/APP_ICON_CERTO.png
  image_dark: assets/branding/APP_ICON_CERTO.png
  android_12:
    color: "#F3EEE6"
    color_dark: "#050505"
    image: assets/branding/APP_ICON_CERTO.png
    image_dark: assets/branding/APP_ICON_CERTO.png
    icon_background_color: "#F3EEE6"
    icon_background_color_dark: "#050505"
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/home/
